# /etc/sysctl.d/k8s.conf
# 来源：施工手册 · 主机底座（内核参数）
# 作用：bridge-nf-call-* 让网桥流量经过 iptables；ip_forward 开启 IPv4 转发。
#       三者缺一，Calico 网络与 kube-proxy NAT 都不成立。
# 生效：sysctl --system
# 验收：sysctl net.ipv4.ip_forward 返回 1
net.bridge.bridge-nf-call-iptables  = 1
net.bridge.bridge-nf-call-ip6tables = 1
net.ipv4.ip_forward                 = 1
