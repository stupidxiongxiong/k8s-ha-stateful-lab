# /etc/containerd/certs.d/docker.io/hosts.toml
# 作用：docker.io 镜像经 mirror 拉取（国内直连 registry-1.docker.io 不可用）。
# 约束：mirror 必须写成 [host."..."] 分节 + 换行 capabilities。
#       点号内联写法语法合法，但 containerd 2.4 解析不出 host 表，会静默直连原站且不报错。
# 验证：crictl pull docker.io/library/busybox:1.36（必须用原生地址，否则验不出 mirror 是否生效）

server = "https://registry-1.docker.io"

[host."https://docker.m.daocloud.io"]
  capabilities = ["pull", "resolve"]
