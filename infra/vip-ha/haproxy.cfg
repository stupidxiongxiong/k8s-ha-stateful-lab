# HAProxy · Kubernetes 控制面统一入口
# 来源：manifests Day2 d2t3，追加到发行版自带的 /etc/haproxy/haproxy.cfg 末尾
# 作用：把 vrrp VIP 192.168.80.100:8443 的流量 TCP 透传到三台 apiserver :6443
# 部署位置：3 台 master，配置内容三台完全一致
# 验收：haproxy -c -f /etc/haproxy/haproxy.cfg 输出 RC=0 且无 WARNING；
#       ss -lntp | grep 8443 有 haproxy 在听

# 独立的 TCP 段，避免继承文件顶部 mode http 的 defaults
# 若继承顶部 defaults，timeout client 1m 会每分钟掐断 watch / informer 长连接
defaults k8s-tcp
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client 4h
    timeout server 4h
    timeout check 10s

# 绑定 0.0.0.0 而非 VIP：init 首启时 VIP 尚未漂移，绑 VIP 会导致 socket 起不来
frontend k8s-api
    bind 0.0.0.0:8443
    mode tcp
    option tcplog
    default_backend k8s-api-backend

# 必须写全三台，只写本机则 HA 形同单点；check 为 TCP 连通性探测
backend k8s-api-backend
    mode tcp
    balance roundrobin
    server master1 192.168.80.20:6443 check
    server master2 192.168.80.21:6443 check
    server master3 192.168.80.22:6443 check
