# Keepalived · master1，整份覆盖 /etc/keepalived/keepalived.conf
# 作用：VIP 192.168.80.100 的归属与漂移；chk_haproxy 检测本机 haproxy 存活，失败则降低优先级。
# 三台仅 5 处不同，其余（含 global_defs 两行、virtual_router_id 51）完全一致：
#   master1  LVS_MASTER1  MASTER  200
#   master2  LVS_MASTER2  BACKUP  150
#   master3  LVS_MASTER3  BACKUP  100
# 约束：virtual_router_id 三台必须同为 51，priority 必须互不相同；
#       weight -60 必须大于优先级间隔（50），否则 haproxy 故障时 VIP 不漂移。

global_defs {
    router_id LVS_MASTER1
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface ens160
    virtual_router_id 51
    priority 200
    advert_int 1
    unicast_src_ip 192.168.80.20
    unicast_peer {
        192.168.80.21
        192.168.80.22
    }
    virtual_ipaddress {
        192.168.80.100/24 dev ens160
    }
    track_script {
        chk_haproxy
    }
}
