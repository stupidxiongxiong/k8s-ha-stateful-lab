# Keepalived · master1 配置（整份覆盖 /etc/keepalived/keepalived.conf）
# 来源：施工手册 · 高可用入口（VIP 漂移）
# 作用：让 VIP 192.168.80.100 在三台 master 间漂移；chk_haproxy 检测本机 haproxy 存活
# 部署位置：master1（priority 200，初始主）
# 三台差异只在下表 5 处，其余（含 global_defs 两行、virtual_router_id 51）完全一致：
#   节点      router_id     state   priority  unicast_src_ip  unicast_peer
#   master1   LVS_MASTER1   MASTER  200       192.168.80.20   .21 .22
#   master2   LVS_MASTER2   BACKUP  150       192.168.80.21   .20 .22
#   master3   LVS_MASTER3   BACKUP  100       192.168.80.22   .20 .21
# 警示①：weight -60 必须大于优先级间隔(50)，否则 haproxy 挂了 VIP 也不漂，
#         表现为「VIP 在但 8443 连不上」，极难查。
# 警示②：三台 virtual_router_id 必须同为 51，priority 必须互不相同。
# 验收：systemctl is-active keepalived 均 active；仅 master1 的 ip -br a show ens160
#       能看到 192.168.80.100/24

global_defs {
    router_id LVS_MASTER1
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state MASTER
    interface ens160
    virtual_router_id 51
    priority 200
    advert_int 1
    unicast_src_ip 192.168.80.20
    unicast_peer {
        192.168.80.21
        192.168.80.22
    }
    virtual_ipaddress {
        192.168.80.100/24 dev ens160
    }
    track_script {
        chk_haproxy
    }
}
