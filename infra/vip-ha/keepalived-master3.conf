# Keepalived · master3，整份覆盖 /etc/keepalived/keepalived.conf
# 与 master1 的差异：router_id / state / priority / unicast_src_ip / unicast_peer。
# 约束：virtual_router_id 保持 51，其余（含 global_defs 两行）与三台一致。

global_defs {
    router_id LVS_MASTER3
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface ens160
    virtual_router_id 51
    priority 100
    advert_int 1
    unicast_src_ip 192.168.80.22
    unicast_peer {
        192.168.80.20
        192.168.80.21
    }
    virtual_ipaddress {
        192.168.80.100/24 dev ens160
    }
    track_script {
        chk_haproxy
    }
}
