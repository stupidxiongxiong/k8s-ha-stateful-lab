# Keepalived · master3 配置（整份覆盖 /etc/keepalived/keepalived.conf）
# 来源：施工手册 · 高可用入口（由 master1 配置改 5 处得到）
# 部署位置：master3（priority 100，备）
# 与 master1 的差异：router_id / state / priority / unicast_src_ip / unicast_peer
# 警示：virtual_router_id 保持 51 不变；global_defs 两行保持与三台一致。
# 验收：systemctl is-active keepalived 为 active；常态下本机不应持有 VIP

global_defs {
    router_id LVS_MASTER3
    script_user root
    enable_script_security
}

vrrp_script chk_haproxy {
    script "/usr/bin/pgrep -x haproxy"
    interval 2
    weight -60
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface ens160
    virtual_router_id 51
    priority 100
    advert_int 1
    unicast_src_ip 192.168.80.22
    unicast_peer {
        192.168.80.20
        192.168.80.21
    }
    virtual_ipaddress {
        192.168.80.100/24 dev ens160
    }
    track_script {
        chk_haproxy
    }
}
