# ArgoCD Application：把 Git 中的清单目录与集群目标位置绑定为持续对齐关系。
# 约束：source.repoURL 必须与 repository Secret 的 stringData.url 完全一致，否则凭据匹配不上。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-lab
  namespace: argocd          # Application 对象所在命名空间，与业务命名空间不同
spec:
  project: default
  source:
    repoURL: ssh://root@192.168.80.20/root/gitops-lab.git
    targetRevision: main
    # 目录而非文件名；本 Application 不运行 Helm，Git 中存放已渲染的纯 YAML
    path: manifests
  destination:
    server: https://kubernetes.default.svc   # 管理自身所在集群时使用集群内 DNS 名
    namespace: gitops-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # 目标命名空间不存在时，由同步过程创建
      - CreateNamespace=true
