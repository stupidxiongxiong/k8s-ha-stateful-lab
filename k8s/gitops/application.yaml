# ============================================================
# ArgoCD Application（声明式期望状态）
# 来历：ArgoCD 官方 declarative-setup 的 minimal Application spec；
#       v3.6.1 安装清单第 3~8 行已注册 applications.argoproj.io 这个 CRD。
# 作用：把「Git 里哪份清单」与「集群里哪个位置」绑成一条持续对齐关系。
#       ⚠️ 它只是一份声明，本身不连 Git、不读凭据、不改集群；
#          干活的是 application-controller 与 repo-server（见正文讲解）。
# 定位：骨架按官方最小示例搭，11 处留空由你填；填完交 AI 检阅，过了再上传。
# 上传：建议放 /root/gitops-work/application.yaml —— 手册 t7 的
#       kubectl apply -f application.yaml 是相对路径，这样直接能跑。
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # 【填空 1】name：这个 Application 在 ArgoCD 里的名字。
  # 来历：官方原文 For Application and AppProject resources, the name of the
  #       resource equals the name of the application or project within Argo CD.
  # 作用：UI / CLI / status 查询全靠它定位；同一个 ArgoCD 里不能重名。
  # 非用不可：漏了 apiserver 直接拒收；填错则本 Application 的
  #           kubectl -n argocd get application <名字> 查不到。
  # 依据：验收命令中使用的命名空间名。
  # 边界：合 DNS-1123（小写字母/数字/-/.），别带空格与大写。
  name: gitops-lab

  # 【填空 2】namespace：这份 Application 对象自己装在哪个命名空间。
  # 来历：官方原文 All resources, including Application and AppProject specs,
  #       have to be installed in the Argo CD namespace (by default argocd).
  # 作用：决定 controller 去哪 watch 到它。
  # 边界：⚠️ 不是「业务要装到哪」，那是填空 8；两处故意不同。
  #       填错 = 对象建出来了但 ArgoCD 根本看不见，现象是「没反应」。
  namespace: argocd

spec:
  # 【填空 3】project：所属 AppProject。
  # 来历：AppProject 是 ArgoCD 的逻辑分组与权限边界；没另建 Project 时
  #       安装清单默认提供一个。
  # 非用不可：填一个不存在的 Project，Application 会一直报 InvalidSpecError。
  # 去哪找答案：kubectl -n argocd get appprojects
  project: default

  source:
    # 【填空 4】repoURL：Git 仓库地址。
    # 来历：本 lab 的 Git 源是 master1 上的内网 SSH 裸仓库，
    #       不是 GitHub；协议与主机写错都连不上。
    # 作用：repo-server 拿它去 clone / fetch。
    # 🔴 硬判据：必须与 repository Secret 的 stringData.url
    #           **一字不差**，否则凭据按 URL 匹配不上，报认证失败。
    # 边界：官方 private-repositories 只列 https:// 与 ssh:// 两类，
    #       不支持 git://、file:// 或本地路径。
    repoURL: ssh://root@192.168.80.20/root/gitops-lab.git

    # 【填空 5】targetRevision：要跟哪条 revision。
    # 来历：可以是分支名、tag 或 commit hash；裸仓库用 symbolic-ref
    #       把裸仓库 HEAD 指向了某个分支，去那条命令里找答案。
    # 作用：repo-server checkout 到它，再取 path 下的清单。
    # 边界：写错 = revision not found，或一直 OutOfSync。
    targetRevision: main

    # 【填空 6】path：仓库里的哪个「目录」。
    # 来历：t4 把 helm template 的结果写进 manifests/all.yaml 并推上去。
    # 作用：repo-server 在这个目录下找所有清单文件。
    # ⚠️ 是目录不是文件名；且 ArgoCD 在本 lab 里**不跑 Helm** ——
    #    Git 里那份是渲染好的纯 YAML，所以这里不要写 chart / helm 段。
    # 边界：指错 = app path does not exist，或渲染出 0 个对象
    #       （Synced 但业务 ns 里啥也没有）。
    path: manifests

  destination:
    # 【填空 7】server：目标集群的 apiserver 地址。
    # 来历：ArgoCD 可以管外部集群；管「自己所在的这个集群」时，
    #       官方约定用集群内 Service DNS 名，不写真实 IP。
    # 作用：controller 往哪里 apply 清单。
    # 去哪找答案：官方 minimal Application spec 示例里那一行。
    server: https://kubernetes.default.svc
    # 【填空 8】namespace：业务对象最终落到哪个命名空间。
    # 来历：业务命名空间与 helm-lab 的 Helm Release 分开，
    #       两套账本（Git commit 对 Helm revision），互不干扰。
    # 🔴 与填空 2 的区别：2 是「这张声明放哪」，8 是「清单里的对象放哪」。
    # 边界：这个 ns 此刻还不存在，由填空 11 在同步时顺手创建。
    namespace: gitops-lab

  syncPolicy:
    automated:
      # 【填空 9】prune：Git 里删掉的对象，集群里要不要跟着删。
      # 来历：automated 下的两个开关之一，默认关。
      # 作用：决定「Git 是唯一事实源」有多彻底。
      # 边界：本 lab 不删对象，但它仍是生产里最常被问到的一个开关。
      prune: true

      # 【填空 10】selfHeal：有人在集群里手改了纳管对象，要不要自动改回去。
      # 来历：官方默认关；丛集自愈演练全靠它。
      # 非用不可：不开 = 只停在 OutOfSync 等人手点 sync，t8-B 直接失败。
      # 边界：只管本 Application 纳管的对象与字段，不是「集群被锁住」；
      #       apiserver 照收手改，controller 是事后收敛。
      selfHeal: true

    syncOptions:
      # 【填空 11】syncOptions：同步行为开关列表，元素是「键=值」字符串。
      # 来历：与 automated 平级的另一组策略。
      # 作用：目标 ns 还不存在时，让 ArgoCD 在同步时顺手把它建出来。
      # 🔴 判据：漏了它，同步时 ns 不存在 → 对象建不出来，
      #          现象正是刚才那次 kubectl get ns 里业务 ns 压根没出现。
      # 边界：这是 sync 时才执行的动作，不是 apply Application 时立刻建 ns。
      - CreateNamespace=true
