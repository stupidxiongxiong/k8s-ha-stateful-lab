# Chart 元数据。文件名固定为 Chart.yaml。
apiVersion: v2          # Helm 3 Chart 格式版本
name: demo-chart
type: application       # application 产出可部署对象；library 仅供其他 Chart 复用
version: "0.1.0"        # Chart 自身版本，与 helm upgrade 生成的 revision 无关
appVersion: "1.0.0"     # 被部署应用版本，仅作展示
description: "部署 web-demo，容器为 busybox"
