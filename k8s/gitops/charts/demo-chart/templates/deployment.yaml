# 不写 namespace（由 helm --namespace / ArgoCD destination 决定）；
# 不写 imagePullPolicy（固定 tag 默认 IfNotPresent，镜像已预拉）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo          # 写死；Release 名与对象名无关
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo       # 必须与 selector 一致，否则 apiserver 拒绝创建
    spec:
      containers:
        - name: demo

          # 外层双引号将拼接结果声明为字符串；此处未使用 quote 过滤器。
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

          command: ["sh","-c","while true; do cat /etc/config/message; sleep 30; done"]

          volumeMounts:
            - name: config
              mountPath: /etc/config   # 挂载整个 ConfigMap，data 键名即文件名
      volumes:
        - name: config               # 与上面 volumeMounts 的 name 一致
          configMap:
            name: demo-config        # 与 templates/configmap.yaml 的 metadata.name 一致
