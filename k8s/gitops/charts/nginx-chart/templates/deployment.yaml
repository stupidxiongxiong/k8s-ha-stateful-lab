# 不写 namespace、nodeAffinity、imagePullPolicy：分别由 destination 与固定 tag 默认值决定。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  # 整数，不加引号，否则渲染为字符串被 apiserver 拒收
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      # 不可变字段：写死，不引用 serviceSelector
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo     # 必须与 selector 一致，否则 apiserver 拒绝创建
    spec:
      containers:
        - name: web
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          # 覆盖镜像的 ENTRYPOINT + CMD；参数非法时启动即退出
          command: ["nginx", "-g", {{ .Values.nginxArgs | quote }}]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: cfg
              mountPath: /etc/config
      volumes:
        - name: cfg
          configMap:
            name: demo-config
