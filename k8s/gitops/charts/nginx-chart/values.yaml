# templates/ 按 .Values.<键> 取值，键名不可修改。三个可调项彼此独立：tag / nginxArgs / serviceSelector。
replicaCount: 3          # 整数，不加引号（引号会变成字符串，apiserver 拒收）

image:
  # 必须与预拉镜像逐字一致：containerd 按完整镜像名做缓存键
  repository: docker.m.daocloud.io/library/nginx
  # 加引号，裸写 1.27 会被 YAML 解析为浮点数
  tag: "1.27"

# nginx 主进程参数，仅被 deployment.yaml 的 command 引用
nginxArgs: daemon off;

# 仅被 service.yaml 引用；Deployment 的 selector 写死 nginx-demo，不引用此值
serviceSelector: nginx-demo

# 写入 demo-config 的文本
