# ArgoCD 仓库凭据 Secret（SSH 私钥方式）
# 来源：ArgoCD 官方 declarative-setup 文档的 repository Secret 示例
# 作用：使 argocd-repo-server 获得访问内网 Git 源的私钥；Application 靠 repository 标签识别此凭据
# 安全约定：sshPrivateKey 仅保留结构占位；真值只在 VM 上于 apply 前注入，
#           不写入本文件、不入 Git、不截图。apply 后可删除 VM 上的明文副本。
apiVersion: v1
kind: Secret
metadata:
  name: gitops-lab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: ssh://root@192.168.80.20/root/gitops-lab.git
  sshPrivateKey: |
    <SSH_PRIVATE_KEY_PLACEHOLDER>
    # 在 VM 上整段替换：须含 BEGIN/END OPENSSH PRIVATE KEY 两行，中间每行保持缩进
