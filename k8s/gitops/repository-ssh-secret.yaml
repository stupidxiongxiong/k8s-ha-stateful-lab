# ArgoCD 仓库凭据（SSH 私钥方式）：argocd-repo-server 用它访问 Git 源，按 url 与 Application 匹配。
# 约束：sshPrivateKey 仅保留占位符，真值在部署时注入，不写入本文件。
apiVersion: v1
kind: Secret
metadata:
  name: gitops-lab-repo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: ssh://root@192.168.80.20/root/gitops-lab.git
  sshPrivateKey: |
    <SSH_PRIVATE_KEY_PLACEHOLDER>
