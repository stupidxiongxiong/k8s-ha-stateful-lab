# SSH known_hosts：argocd-repo-server 校验 Git 服务器主机公钥。
# 约束：对象名为固定值，改名后不被加载；data 中同名键为整体覆盖，不是追加。
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ssh-known-hosts-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-ssh-known-hosts-cm
    app.kubernetes.io/part-of: argocd    # 缺失时 ArgoCD 不加载该 ConfigMap
data:
  # 每行三列：<主机> <算法> <base64 公钥>
  ssh_known_hosts: |
    192.168.80.20 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICL7oDDtlzo1CWdprJsZDpkmL8XfSbI+FUjPhSoxeux2
