# Grafana：仅保存面板与数据源定义，指标实时向 Prometheus 查询。
# 约束：GF_SECURITY_ADMIN_PASSWORD 保持占位符，真值在部署时注入，不写入会入版本库的文件。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.4.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "<你的Grafana管理员密码>"      # 占位符，部署时替换
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: watch
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30310
