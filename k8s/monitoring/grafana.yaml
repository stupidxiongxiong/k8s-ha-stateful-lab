# Grafana（Deployment + Service）
# 作用：只存「面板怎么画」的定义，指标实时向 Prometheus 查——删了重建曲线不丢
# 来源：镜像 docker.io/grafana/grafana:11.4.0
# 安全：管理员密码用占位符，apply 前在 VM 上替换；绝不可把真值写进本文件（会入 Git）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:11.4.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "<你的Grafana管理员密码>"      # 占位符，apply 前在 VM 上替换，别写真值进会入 Git 的文件
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: watch
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30310
