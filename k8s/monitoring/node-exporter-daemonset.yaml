# node-exporter DaemonSet：每节点一个实例，暴露节点 CPU / 内存 / 磁盘 / 网络指标于 9100。
# hostNetwork + hostPID + toleration Exists 使 master 节点也运行；--path.rootfs 指定宿主机根文件系统。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: watch
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.2
          args:
            - --path.rootfs=/host
          ports:
            - containerPort: 9100
              hostPort: 9100
          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
      volumes:
        - name: host
          hostPath:
            path: /
