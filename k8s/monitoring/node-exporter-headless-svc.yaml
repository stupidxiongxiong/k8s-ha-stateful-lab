# node-exporter headless Service：clusterIP: None 不做负载均衡，DNS 查询返回全部 Pod IP，
# 供 Prometheus 通过 dns_sd 一次取得所有抓取目标。
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: watch
spec:
  clusterIP: None
  selector:
    app: node-exporter
  ports:
    - port: 9100
      targetPort: 9100
