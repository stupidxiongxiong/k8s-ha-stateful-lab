# 抓取配置样例：static_configs 直连目标；实际部署使用 prometheus.yaml 中的 ConfigMap。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'node_exporter'
    metrics_path: '/metrics'
    static_configs:
    - targets: ['192.168.44.129:9100']

  - job_name: mysqld_exporter
    params:
      auth_module: [client]
    static_configs:
      - targets:
        - 192.168.44.129:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.44.129:9104
