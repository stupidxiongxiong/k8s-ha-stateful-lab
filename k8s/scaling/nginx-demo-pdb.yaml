# PodDisruptionBudget：主动驱逐时保证 nginx-demo 至少 2 个可用（ALLOWED = Ready 数 - minAvailable）。
# 约束：只约束自愿中断（drain / evict），不覆盖 Pod 崩溃；有状态数据固定在 worker1，drain 应避开该节点。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nginx-demo-pdb
  namespace: gitops-lab
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: nginx-demo
