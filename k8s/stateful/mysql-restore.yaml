apiVersion: v1
kind: Pod
metadata:
  name: mysql-restore
spec:
  nodeSelector:
    kubernetes.io/hostname: worker1
  containers:
  - name: mysql
    image: docker.m.daocloud.io/library/mysql:8.4.9
    args:
    - --gtid-mode=ON
    - --enforce-gtid-consistency=ON
    - --log-bin=/var/lib/mysql/restore-bin
    - --server-id=999
    env:
    - name: MYSQL_ROOT_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mysql-secret
          key: root-password
    volumeMounts:
    - name: data
      mountPath: /var/lib/mysql
  volumes:
  - name: data
    emptyDir: {}