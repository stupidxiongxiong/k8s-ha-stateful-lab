# 消费该 PVC 的 Pod：触发 WaitForFirstConsumer 延迟绑定；无消费者时 PVC 保持 Pending 属预期行为。
apiVersion: v1
kind: Pod
metadata:
  name: pvc-consumer
  namespace: default
spec:
  containers:
    - name: c
      image: docker.io/library/busybox:1.36
      command: ["sh", "-c", "echo hello-local-path > /data/test.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pvc-demo          # 与 PVC 名称一致
