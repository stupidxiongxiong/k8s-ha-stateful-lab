# headless Service（clusterIP: None）：不做负载均衡，为每个 Pod 提供固定可解析的 DNS 记录，
# 形如 web-0.web.default.svc.cluster.local。
# 约束：name 必须与 StatefulSet 的 spec.serviceName 一字不差。
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None
  selector:
    app: web               # 与 StatefulSet Pod 模板的 labels 一致
  ports:
    - port: 80
      name: http
