# headless Service（clusterIP: None）
# 作用：不做负载均衡，只给每个 Pod 一条「固定可解析」的 DNS 记录
#       web-0 → web-0.web.default.svc.cluster.local
#       web-1 → web-1.web.default.svc.cluster.local
# 注意：serviceName 必须和 StatefulSet 的 spec.serviceName 一字不差
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None          # ← 这一行就是「headless」的全部含义
  selector:
    app: web               # 必须和 StatefulSet 里 Pod 模板的 labels 对上
  ports:
    - port: 80
      name: http
