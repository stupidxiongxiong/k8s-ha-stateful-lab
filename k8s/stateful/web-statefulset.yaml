# 2 副本 nginx StatefulSet + volumeClaimTemplates
# 目的：验证「每副本固定名字 + 独立盘 + 稳定 DNS + 有序启停」
#
# 镜像：docker.io/library/nginx:1.27（走 daocloud 镜像）
#       若 worker1 上没有，会先拉一次（约 70MB）
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web          # ← 必须等于 headless Service 的名字（靠它发 DNS）
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          # 先把自己的名字写进 /data/hostname（这块盘是本副本专属的），再起 nginx
          command: ["sh", "-c", "echo $(hostname) > /data/hostname; exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
  # ↓↓↓ 这一段就是「自动分盘」的核心：模板写一次，每个副本各生成一份 PVC
  volumeClaimTemplates:
    - metadata:
        name: data          # 生成的 PVC 叫 data-web-0 / data-web-1
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
