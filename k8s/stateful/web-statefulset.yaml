# 2 副本 nginx StatefulSet：每副本固定名、独立 PVC、稳定 DNS、有序启停。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  serviceName: web          # 必须是 headless Service 的名称，DNS 记录由它生成
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27
          # 先把本副本名写入专属数据卷，再启动 nginx
          command: ["sh", "-c", "echo $(hostname) > /data/hostname; exec nginx -g 'daemon off;'"]
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
  # 模板只需写一次，每个副本各生成一份 PVC
  volumeClaimTemplates:
    - metadata:
        name: data          # 生成 PVC 名：data-web-0 / data-web-1
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
